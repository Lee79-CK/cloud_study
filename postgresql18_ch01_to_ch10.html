<style>
:root {
  --bg:#050b14;
  --panel:#0b1726;
  --panel2:#10243a;
  --text:#eef5ff;
  --muted:#9db0c8;
  --line:#29415e;
  --accent:#54c7ec;
  --accent2:#8b7cf6;
  --good:#43d19e;
}
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
body {
  background:
    radial-gradient(circle at 20% -10%, rgba(84,199,236,.14), transparent 28%),
    radial-gradient(circle at 80% 0%, rgba(139,124,246,.13), transparent 30%),
    var(--bg);
}
.shell { min-height:100vh; display:flex; flex-direction:column; }
.header {
  position:sticky; top:0; z-index:100;
  background:rgba(5,11,20,.94); backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.headrow {
  max-width:1500px; margin:0 auto; padding:14px 18px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.brand { display:flex; align-items:center; gap:11px; min-width:0; }
.logo {
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;
  box-shadow:0 10px 28px rgba(84,199,236,.22);
}
.title { font-weight:850; letter-spacing:-.02em; }
.subtitle { color:var(--muted); font-size:.82rem; margin-top:1px; }
.status {
  border:1px solid var(--line); border-radius:999px; padding:6px 10px; color:var(--muted);
  background:var(--panel); font-size:.82rem;
}
.tabs-wrap {
  max-width:1500px; margin:0 auto; padding:0 18px 12px;
}
.tabs {
  display:flex; gap:8px; overflow-x:auto; padding:2px 0 3px;
  scrollbar-width:thin;
}
.tab {
  flex:0 0 auto; min-height:44px; border:1px solid var(--line);
  background:var(--panel); color:var(--muted); border-radius:12px;
  padding:8px 13px; cursor:pointer; text-align:left;
}
.tab:hover { border-color:var(--accent); color:var(--text); }
.tab.active {
  border-color:var(--accent); color:var(--text);
  background:linear-gradient(135deg,rgba(84,199,236,.14),rgba(139,124,246,.12)),var(--panel2);
  box-shadow:inset 0 0 0 1px rgba(84,199,236,.06);
}
.tab strong { display:block; font-size:.9rem; }
.tab span { display:block; font-size:.72rem; margin-top:1px; max-width:175px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.workspace {
  width:100%; max-width:1500px; margin:0 auto; padding:14px 18px 22px; flex:1;
}
.chapter-head {
  border:1px solid var(--line); background:var(--panel); border-radius:16px 16px 0 0;
  padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
}
.chapter-head .name { font-weight:800; }
.chapter-head .hint { color:var(--muted); font-size:.82rem; }
.frame-wrap {
  border:1px solid var(--line); border-top:0; background:#07111f; border-radius:0 0 16px 16px;
  overflow:hidden; min-height:720px;
}
iframe {
  display:block;
  width:100%;
  height:720px;
  min-height:720px;
  border:0;
  background:#07111f;
  overflow:hidden;
}
.loading {
  display:none !important;
}
.keyboard {
  max-width:1500px; margin:0 auto 18px; padding:0 18px; color:var(--muted); font-size:.8rem;
}
kbd {
  display:inline-block; border:1px solid var(--line); border-bottom-width:2px;
  background:var(--panel); color:var(--text); border-radius:6px; padding:1px 6px;
}
@media(max-width:700px) {
  .headrow { align-items:flex-start; }
  .status { display:none; }
  iframe { min-height:640px; }
  .workspace { padding-left:8px; padding-right:8px; }
  .tabs-wrap { padding-left:8px; padding-right:8px; }
}
@media(prefers-reduced-motion:reduce) {
  * { scroll-behavior:auto !important; transition:none !important; }
}
</style>

  const titles = {"1": "PostgreSQL과 데이터베이스의 기초", "2": "PostgreSQL 18 설치와 첫 번째 Database", "3": "SQL 기초와 CRUD", "4": "데이터 모델링과 PostgreSQL 객체", "5": "실전 SQL과 고급 Query", "6": "Transaction, MVCC와 동시성 제어", "7": "Index와 SQL 성능 튜닝", "8": "PostgreSQL 운영·보안·모니터링", "9": "Backup · Restore · HA · Replication", "10": "PostgreSQL 18 신기능과 실전 운영"};

  const viewer = document.getElementById('viewer');
  const status = document.getElementById('status');
  const chapterName = document.getElementById('chapterName');

  const loaded = {};

  function decodeBase64UTF8(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function patchInternalChapterNav(html) {
    // In the combined edition, the outer tabs own chapter navigation.
    html = html.replace(
      /<div class="chapter-nav">[\s\S]*?<\/div>\s*<div class="footer">/,
      '<div class="footer">'
    );

    // Remove viewport-height dependencies that can make an auto-sized iframe
    // grow recursively or clip content. The chapter remains visually identical,
    // but its height is determined by actual document content.
    const embeddedStyle = `
      <style id="combined-embed-fix">
        html, body { min-height:0 !important; height:auto !important; }
        .layout { min-height:0 !important; }
        aside {
          height:auto !important;
          max-height:none !important;
          overflow:visible !important;
        }
        .topbar { position:relative !important; top:auto !important; }
      </style>
    `;
    return html.replace('</head>', embeddedStyle + '</head>');
  }

  let mutationObserver = null;
  let resizeRaf = 0;

  function disconnectFrameObservers() {
    if (mutationObserver) { mutationObserver.disconnect(); mutationObserver = null; }
    if (resizeRaf) { cancelAnimationFrame(resizeRaf); resizeRaf = 0; }
  }

  function getActualContentHeight(doc) {
    const body = doc.body;
    if (!body) return 640;

    // Do NOT use documentElement/body scrollHeight here.
    // Once the iframe becomes taller than its content, scrollHeight can equal
    // the iframe viewport height itself, creating a self-growing feedback loop.
    const bodyTop = body.getBoundingClientRect().top;
    let bottom = 0;

    for (const el of body.children) {
      if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;
      const rect = el.getBoundingClientRect();
      if (!Number.isFinite(rect.bottom)) continue;
      bottom = Math.max(bottom, rect.bottom - bodyTop);
    }

    const bodyStyle = doc.defaultView.getComputedStyle(body);
    const paddingBottom = parseFloat(bodyStyle.paddingBottom) || 0;
    return Math.max(640, Math.ceil(bottom + paddingBottom));
  }

  function resizeFrame() {
    try {
      const doc = viewer.contentDocument;
      if (!doc || !doc.body) return;

      const targetHeight = getActualContentHeight(doc);
      const currentHeight = parseFloat(viewer.style.height) || 0;

      // Avoid tiny rounding changes repeatedly retriggering layout.
      if (Math.abs(currentHeight - targetHeight) > 2) {
        viewer.style.height = targetHeight + 'px';
      }
    } catch (e) {}
  }

  function scheduleResize() {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = 0;
      resizeFrame();
    });
  }

  function observeFrameSize() {
    disconnectFrameObservers();
    try {
      const doc = viewer.contentDocument;
      if (!doc || !doc.body) return;

      // Observe real content/state changes only. A ResizeObserver on the whole
      // document can react to the iframe's own height change and form a loop.
      mutationObserver = new MutationObserver(scheduleResize);
      mutationObserver.observe(doc.body, {
        subtree:true,
        childList:true,
        attributes:true,
        characterData:true
      });

      // Native disclosure elements can change visual height without changing DOM.
      doc.addEventListener('toggle', scheduleResize, true);
      doc.addEventListener('click', () => setTimeout(scheduleResize, 0), true);
      doc.addEventListener('change', () => setTimeout(scheduleResize, 0), true);

      scheduleResize();
      setTimeout(scheduleResize, 60);
      setTimeout(scheduleResize, 220);
    } catch (e) {}
  }

  function loadChapter(ch) {
    ch = Math.max(1, Math.min(10, Number(ch) || 1));
    current = ch;
    tabs.forEach(btn => {
      const active = Number(btn.dataset.ch) === ch;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
      if (active) btn.scrollIntoView({behavior:'smooth', block:'nearest', inline:'nearest'});
    });
    status.textContent = `Chapter ${ch} / 10`;
    chapterName.textContent = `${ch}장. ${titles[String(ch)]}`;
    viewer.title = `PostgreSQL 18 강의 Chapter ${ch}`;

    disconnectFrameObservers();
    viewer.style.visibility = 'visible';
    viewer.style.height = '640px';

    // Switching chapters should always start at the top of the new lesson.
    window.scrollTo({top:0, left:0, behavior:'auto'});

    if (!loaded[ch]) {
      loaded[ch] = patchInternalChapterNav(decodeBase64UTF8(chapterData[String(ch)]));
    }
    viewer.srcdoc = loaded[ch];

    viewer.onload = () => {
      viewer.style.visibility = 'visible';
      try {
        const doc = viewer.contentDocument;
        if (doc) {
          // Keep dark theme as default on every chapter switch.
          doc.documentElement.setAttribute('data-theme','dark');
        }
      } catch (e) {}

      // Match the iframe to the complete chapter height and continue tracking
      // changes caused by quizzes, details, answer reveals, responsive reflow, etc.
      observeFrameSize();
    };
  }

  tabs.forEach(btn => btn.addEventListener('click', () => loadChapter(btn.dataset.ch)));

  document.addEventListener('keydown', (e) => {
    if (!e.altKey) return;
    const active = document.activeElement;
    if (active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return;
    if (e.key === 'ArrowRight' && current < 10) {
      e.preventDefault(); loadChapter(current + 1);
    } else if (e.key === 'ArrowLeft' && current > 1) {
      e.preventDefault(); loadChapter(current - 1);
    }
  });

  window.addEventListener('resize', scheduleResize, {passive:true});
  loadChapter(1);
